function comicScene(s,n){const poses=[['20','42','54','40'],['28','50','62','46'],['22','44','58','42']][n];return `<div class="comic" role="img" aria-label="漫畫：${s[1]}"><div class="speech">我先${s[1]}</div><svg class="scene" viewBox="0 0 240 155" aria-hidden="true"><rect x="0" y="104" width="240" height="51" fill="#efd39b"/><circle cx="${poses[0]}" cy="43" r="18" fill="#ffd5b5" stroke="#25231f" stroke-width="4"/><path d="M${poses[0]-15} 32 Q${poses[0]} 10 ${+poses[0]+17} 31" fill="#49382d" stroke="#25231f" stroke-width="4"/><circle cx="${+poses[0]-6}" cy="43" r="2.5"/><circle cx="${+poses[0]+6}" cy="43" r="2.5"/><path d="M${+poses[0]-5} 52 Q${poses[0]} 57 ${+poses[0]+5} 52" fill="none" stroke="#25231f" stroke-width="2"/><path d="M${poses[0]} 61 L${poses[1]} 112 M${poses[1]} 78 L${poses[2]} 91 M${poses[1]} 80 L${poses[3]} 96 M${poses[1]} 112 L${+poses[1]-14} 145 M${poses[1]} 112 L${+poses[1]+18} 145" fill="none" stroke="#25231f" stroke-width="9" stroke-linecap="round"/><rect x="112" y="91" width="86" height="48" rx="4" fill="#fff" stroke="#25231f" stroke-width="4"/><line x1="124" y1="105" x2="185" y2="105" stroke="#8aa6c0" stroke-width="3"/><line x1="124" y1="117" x2="177" y2="117" stroke="#8aa6c0" stroke-width="3"/><line x1="124" y1="129" x2="188" y2="129" stroke="#8aa6c0" stroke-width="3"/></svg><span class="action">${s[0]}</span></div>`}
comicScene=(s,n)=>{const t=s[1]+s[2],kind=/交|送|繳|回傳|歸還|借閱/.test(t)?'submit':/討論|詢問|說明|老師|面談|確認/.test(t)?'talk':/填|寫|勾|簽|選|圈|記錄/.test(t)?'write':/準備|帶|找|收集|影印|證明|課表|資料/.test(t)?'prepare':/等|通知|結果|審查|核定|評估/.test(t)?'wait':'act';const teacher=`<g transform="translate(170 58)"><circle cx="0" cy="0" r="16" fill="#f5c6a5" stroke="#25231f" stroke-width="3"/><path d="M-15 -5 Q0 -25 15 -5" fill="#5a4336"/><rect x="-18" y="17" width="36" height="50" rx="12" fill="#4a8c64" stroke="#25231f" stroke-width="3"/><path d="M-18 30 L-42 52 M18 30 L40 48" stroke="#25231f" stroke-width="7" stroke-linecap="round"/><path d="M-8 67 L-12 100 M8 67 L12 100" stroke="#25231f" stroke-width="8" stroke-linecap="round"/></g>`;const student=`<g transform="translate(60 62)"><circle cx="0" cy="0" r="17" fill="#ffd5b5" stroke="#25231f" stroke-width="3"/><path d="M-16 -5 Q0 -27 18 -4" fill="#49382d"/><circle cx="-6" cy="0" r="2"/><circle cx="6" cy="0" r="2"/><path d="M-5 9 Q0 13 5 9" fill="none" stroke="#25231f" stroke-width="2"/><rect x="-20" y="18" width="40" height="54" rx="12" fill="#4f79a7" stroke="#25231f" stroke-width="3"/><path d="M-20 32 L-43 55 M20 32 L43 52" stroke="#25231f" stroke-width="7" stroke-linecap="round"/><path d="M-9 72 L-13 105 M9 72 L14 105" stroke="#25231f" stroke-width="8" stroke-linecap="round"/></g>`;const props={talk:`${teacher}<rect x="92" y="120" width="55" height="28" rx="4" fill="#fff" stroke="#25231f" stroke-width="3"/><path d="M107 82 q15 -17 30 0" fill="none" stroke="#d7544d" stroke-width="3"/><circle cx="107" cy="78" r="4" fill="#d7544d"/><circle cx="137" cy="78" r="4" fill="#d7544d"/>`,write:`<rect x="91" y="104" width="113" height="46" rx="4" fill="#c98755" stroke="#25231f" stroke-width="3"/><rect x="113" y="76" width="66" height="54" fill="#fff" stroke="#25231f" stroke-width="3"/><path d="M122 89 H169 M122 101 H163 M122 113 H169" stroke="#7192b2" stroke-width="3"/><path d="M79 101 L119 83" stroke="#d49a27" stroke-width="6"/>`,prepare:`<rect x="102" y="91" width="93" height="58" rx="5" fill="#fff" stroke="#25231f" stroke-width="3"/><rect x="112" y="78" width="73" height="58" rx="5" fill="#fff8db" stroke="#25231f" stroke-width="3"/><path d="M122 91 H175 M122 103 H165 M122 115 H172" stroke="#7192b2" stroke-width="3"/><rect x="89" y="111" width="48" height="35" rx="5" fill="#f4c44d" stroke="#25231f" stroke-width="3"/>`,submit:`${teacher}<rect x="101" y="103" width="58" height="43" fill="#fff" stroke="#25231f" stroke-width="3"/><path d="M111 116 H149 M111 128 H143" stroke="#7192b2" stroke-width="3"/><path d="M91 91 Q121 72 151 91" fill="none" stroke="#d7544d" stroke-width="4" marker-end="url(#arrow)"/>`,wait:`${teacher}<circle cx="118" cy="108" r="30" fill="#fff" stroke="#25231f" stroke-width="4"/><path d="M118 88 V108 L133 118" fill="none" stroke="#264b78" stroke-width="4"/><path d="M96 75 q22 -18 44 0" fill="none" stroke="#d49a27" stroke-width="4"/>`,act:`<rect x="104" y="87" width="82" height="59" rx="8" fill="#fff" stroke="#25231f" stroke-width="3"/><text x="145" y="126" text-anchor="middle" font-size="36">${s[0]}</text>`}[kind];return `<div class="comic" role="img" aria-label="情境漫畫：${s[1]}"><div class="speech"><small>學生說：</small><br>${s[1]}</div><svg class="scene" viewBox="0 0 240 180" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#d7544d"/></marker></defs><rect width="240" height="180" fill="#f8f0df"/><rect x="10" y="8" width="63" height="44" rx="3" fill="#cce8f5" stroke="#25231f" stroke-width="3"/><path d="M41 8 V52 M10 30 H73" stroke="#fff" stroke-width="3"/><rect x="150" y="10" width="78" height="35" rx="5" fill="#fff" stroke="#25231f" stroke-width="3"/><text x="189" y="33" text-anchor="middle" font-size="14" font-weight="700">資源教室</text><rect y="148" width="240" height="32" fill="#e7c48b"/>${student}${props}<circle cx="218" cy="66" r="20" fill="#fff" stroke="#25231f" stroke-width="3"/><text x="218" y="75" text-anchor="middle" font-size="25">${s[0]}</text></svg><span class="action">${n===0?'先':n===1?'再':'最後'}</span></div>`};
function openForm(i){const f=forms[i];listView.classList.add('hide');detail.classList.remove('hide');detail.style.setProperty('--c',f[3]);detail.innerHTML=`<button class="back">← 回到看懂表格</button><div class="title"><span class="ico">${f[2]}</span><div><p class="eyebrow">第 2 步・看懂三步驟</p><h1>${f[0]}</h1><small>${f[1]}</small></div></div><div class="box who"><b>🙋 這張表給誰？</b><p>${f[4]}</p></div><div class="box prep"><b>📂 先準備</b><ul>${f[5].map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="steps">${f[6].map((s,n)=>`<article class="step"><b class="num">第 ${n+1} 步</b>${comicScene(s,n)}<h2>${s[1]}</h2><p>${s[2]}</p><button>○ 完成這一步</button></article>`).join('')}</div>${f[7]?`<div class="box warn"><b>⚠️ 要注意</b><p>${f[7]}</p></div>`:''}<div class="official">這是易讀說明，不是正式申請表。日期、資格和附件，請以資源教室最新公告與正式表格為準。</div>`;detail.querySelector('.back').onclick=goHome;detail.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{b.parentElement.classList.toggle('done');b.textContent=b.parentElement.classList.contains('done')?'✓ 做完了':'○ 完成這一步'});scrollTo({top:0,behavior:'smooth'})}
function goHome(){detail.classList.add('hide');listView.classList.remove('hide');scrollTo({top:0,behavior:'smooth'})}search.oninput=e=>renderList(e.target.value);document.querySelector('#home').onclick=goHome;renderList();
</script></body></html>
